version: '3'

services:
  mongodb:
    image: mongo:latest
    env_file:
      - .env
    ports:
      - "27017:27017"
    command:
      mongod --quiet --logpath /dev/null
    networks:
      - mynetwork
    volumes:
      - mongo_data:/var/lib/mongo/data/

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - mynetwork

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_HOST_NAME: kafka
    networks:
      - mynetwork

  microservice:
    restart: unless-stopped
    build: .
    env_file:
      - .env
    volumes:
      - .:/home/microservice_for_trading/microservice
    ports:
      - "8989:8989"
    networks:
      - mynetwork
    depends_on:
      - mongodb
      - kafka

volumes:
  kafka_data:
  mongo_data:

networks:
  mynetwork:
    external: true
